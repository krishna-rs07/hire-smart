{% extends 'base.html' %}

{% block title %}Delete Job - Hire Smart{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Confirm Deletion</h4>
                </div>
                <div class="card-body text-center p-5">
                    <i class="fas fa-briefcase fa-4x text-danger mb-3"></i>
                    <h3 class="fw-bold">Delete "{{ object.title }}"?</h3>
                    <p class="text-muted mb-4">This action cannot be undone. All associated candidate screenings and data will be permanently removed.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-3 justify-content-center">
                            <a href="{% url 'jobs:job_detail' object.pk %}" class="btn btn-secondary btn-lg px-4">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-danger btn-lg px-4">
                                <i class="fas fa-trash me-2"></i>Yes, Delete
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
